workflows:
  ios-simulator-kmp:
    name: iOS Simulator (KMP Shared)
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_WORKSPACE: "PulseLinkiOS.xcworkspace"
        XCODE_SCHEME: "PulseLinkiOS"
        SIM_DEVICE: "iPhone 15"
        DERIVED_DATA: "$CM_BUILD_DIR/derivedData"
      node: v20.12.2
      java: "17"
      cocoapods: default
      xcode: "16.1"
      groups:
        - pulselink-apple-signing   # optional; required only for device builds
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/Library/Caches/CocoaPods
        - iosApp/Pods
    scripts:
      - name: Ensure gradlew is executable
        script: |
          chmod +x ./gradlew
          ln -sf ../gradlew iosApp/gradlew
          chmod +x iosApp/gradlew
      - name: Generate KMP podspec
        script: |
          ./gradlew :shared:podspec
      - name: Build dummy framework for Cocoapods
        script: |
          # Build the actual Shared.framework for simulator (so Xcode doesn't need to invoke Gradle)
          ./gradlew :shared:syncFramework \
            -Pkotlin.native.cocoapods.platform=iphonesimulator \
            -Pkotlin.native.cocoapods.archs=arm64 \
            -Pkotlin.native.cocoapods.configuration=Debug
      - name: Generate Xcode project via XcodeGen
        script: |
          brew install xcodegen
          cd iosApp
          xcodegen generate --spec project.yml
      - name: Install CocoaPods
        script: |
          cd iosApp
          pod install
      - name: Verify Firebase config exists
        script: |
          if [ ! -f "iosApp/PulseLinkiOS/GoogleService-Info.plist" ]; then
            echo "GoogleService-Info.plist missing. Add it to iosApp/PulseLinkiOS in repo or provide via secure files." && exit 1
          fi
      - name: Build iOS simulator app
        script: |
          cd iosApp
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package simulator app
        script: |
          APP_PATH=$(find "$DERIVED_DATA" -name "PulseLinkiOS.app" -path "*Build/Products/Debug-iphonesimulator/*" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Simulator app not found" && exit 1
          fi
          zip -r PulseLinkIOS-sim-debug.zip "$APP_PATH"
    artifacts:
      - PulseLinkIOS-sim-debug.zip
