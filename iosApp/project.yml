name: PulseLinkiOS
options:
  bundleIdPrefix: com.pulselink
configs:
  Debug: debug
  Release: release
settings:
  DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
  SWIFT_VERSION: 5.9
  IPHONEOS_DEPLOYMENT_TARGET: 16.0
  CODE_SIGN_STYLE: Automatic
  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  PulseLinkiOS:
    type: application
    platform: iOS
    sources:
      - path: PulseLinkiOS
        excludes:
          - "**/*.xcworkspace"
          - "**/*.xcuserstate"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.pulselink.ios
      INFOPLIST_FILE: PulseLinkiOS/Info.plist
