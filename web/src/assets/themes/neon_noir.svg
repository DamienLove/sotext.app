<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="none">
  <rect width="100%" height="100%" fill="#0B0F14" />
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="0" y1="100" x2="800" y2="100" stroke="#22D3EE" stroke-width="2" opacity="0.5" filter="url(#neon-glow)" />
  <line x1="0" y1="500" x2="800" y2="500" stroke="#F472B6" stroke-width="2" opacity="0.5" filter="url(#neon-glow)" />
  <path d="M 0 600 L 800 0" stroke="#22D3EE" stroke-width="1" opacity="0.2" />
</svg>