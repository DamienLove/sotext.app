<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FDB931;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="lustre">
      <feSpecularLighting result="specOut" specularExponent="20" lighting-color="#FFFFE0">
        <fePointLight x="400" y="300" z="200"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#332200" />
  <rect width="100%" height="100%" fill="url(#gold-grad)" opacity="0.2" filter="url(#lustre)" />
  <circle cx="0" cy="0" r="500" fill="url(#gold-grad)" opacity="0.1" />
  <circle cx="800" cy="600" r="400" fill="url(#gold-grad)" opacity="0.1" />
</svg>