<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="none">
  <rect width="100%" height="100%" fill="#0B0B0F" />
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1" opacity="0.3" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.2" />
    <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
  </radialGradient>
  <rect width="100%" height="100%" fill="url(#glow)" />
</svg>